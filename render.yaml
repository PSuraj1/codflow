# =============================================================================
# CODkar — Render blueprint.
#
#   render blueprint launch     (or: New > Blueprint in the dashboard)
#
# Four services from one image. The web and worker processes share a Dockerfile
# and differ only in their start command, which is deliberate: identical code,
# identical migrations, one build to promote, and no second pipeline that can
# drift out of step with the first.
#
# Secrets are `sync: false` — Render prompts for them once and never writes them
# to this file. Anything with a value here is safe to read in a public repo.
# =============================================================================

databases:
  - name: codflow-postgres
    databaseName: codflow
    user: codflow
    plan: basic-256mb
    postgresMajorVersion: '17'
    # Deterministic collation so index ordering matches development. Postgres
    # sorts differently under a locale-aware collation, and a query that relies
    # on ordering can behave differently between environments.
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # Web — Express, the embedded admin, webhooks and the app proxy.
  # ---------------------------------------------------------------------------
  - type: web
    name: codflow-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/health/ready
    # Migrations run here, once per deploy, before any instance takes traffic.
    # Running them from the worker instead would race the web process on a
    # simultaneous rollout; running them at container start would run them once
    # per replica.
    preDeployCommand: npm run release
    dockerCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'

      # Render injects the connection strings from the resources below.
      - key: DATABASE_URL
        fromDatabase:
          name: codflow-postgres
          property: connectionString

      # Prisma's schema declares `directUrl`, and its CLI refuses to load a
      # schema whose env() reference is unset — even though the app itself
      # falls back to DATABASE_URL. Without this, `npm run release` fails
      # validation before it reaches a migration. Render's managed Postgres
      # has no separate pooler endpoint, so the two are the same string; the
      # distinction exists for deployments that put PgBouncer in front.
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: codflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codflow-redis
          property: connectionString

      # APP_URL must match `application_url` in shopify.app.toml exactly.
      # Shopify validates the redirect against it, and a trailing slash or a
      # different host fails OAuth with an error that names neither.
      - key: APP_URL
        sync: false

      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        sync: false
      # Must equal `handle` in shopify.app.toml. It builds the managed-pricing
      # URL, so a wrong value produces a Shopify 404 on the upgrade button
      # rather than anything the app can detect.
      - key: SHOPIFY_APP_HANDLE
        value: codflow-codkar

      # openssl rand -base64 32 — rotating this makes every stored Google
      # refresh token undecryptable, so treat it as permanent.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Shops that ignore plan limits — the stores you run yourself. Must be set
      # on *both* services: the worker enforces limits independently, and one
      # without this applies Free-tier ceilings to background pushes.
      - key: PLAN_EXEMPT_SHOPS
        sync: false

      # Inlined into the admin bundle at build time, not read at runtime.
      - key: SUPPORT_TELEGRAM_URL
        sync: false

      - key: LOG_LEVEL
        value: info

  # ---------------------------------------------------------------------------
  # Worker — order pushes, Sheets sync, pixel dispatch, fraud scans, rebuilds.
  # ---------------------------------------------------------------------------
  #
  # Separate from web because the two scale on different pressures: web capacity
  # follows concurrent shoppers, worker capacity follows how fast Shopify will
  # accept writes. Sharing a process means a backlog of pushes competes with
  # request handling for one event loop, and merchants see slow product pages
  # during their own busy hour.
  - type: worker
    name: codflow-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    dockerCommand: node apps/api/dist/queue/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codflow-postgres
          property: connectionString

      # Prisma's schema declares `directUrl`, and its CLI refuses to load a
      # schema whose env() reference is unset — even though the app itself
      # falls back to DATABASE_URL. Without this, `npm run release` fails
      # validation before it reaches a migration. Render's managed Postgres
      # has no separate pooler endpoint, so the two are the same string; the
      # distinction exists for deployments that put PgBouncer in front.
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: codflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codflow-redis
          property: connectionString

      # The worker calls Shopify and Google on the merchant's behalf, so it
      # needs the same credentials as web — including the encryption key, or it
      # cannot decrypt the Google tokens it syncs with.
      - key: APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        sync: false
      # Must equal `handle` in shopify.app.toml. It builds the managed-pricing
      # URL, so a wrong value produces a Shopify 404 on the upgrade button
      # rather than anything the app can detect.
      - key: SHOPIFY_APP_HANDLE
        value: codflow-codkar
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: codflow-web
          envVarKey: ENCRYPTION_KEY
      - key: SESSION_SECRET
        fromService:
          type: web
          name: codflow-web
          envVarKey: SESSION_SECRET
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Shops that ignore plan limits — the stores you run yourself. Must be set
      # on *both* services: the worker enforces limits independently, and one
      # without this applies Free-tier ceilings to background pushes.
      - key: PLAN_EXEMPT_SHOPS
        sync: false

      # Inlined into the admin bundle at build time, not read at runtime.
      - key: SUPPORT_TELEGRAM_URL
        sync: false

      - key: LOG_LEVEL
        value: info

  # ---------------------------------------------------------------------------
  # Redis — BullMQ's backing store.
  # ---------------------------------------------------------------------------
  - type: redis
    name: codflow-redis
    plan: starter
    region: oregon
    ipAllowList: []
    # BullMQ cannot tolerate eviction: a job key dropped by an LRU policy is
    # work that silently never happens — an order that never reaches Shopify,
    # with nothing anywhere to say so. `noeviction` makes Redis reject the write
    # instead, which surfaces as an error the app can log and retry.
    maxmemoryPolicy: noeviction
